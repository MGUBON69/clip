<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบอัปโหลดคลิปวิดีโอ (Fast & Light)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; box-sizing: border-box; text-align: center; }
        h2 { color: #1a73e8; margin-bottom: 20px; font-size: 22px; }
        .file-drop-area { border: 2px dashed #dadce0; border-radius: 12px; padding: 25px; margin-bottom: 20px; background: #f8f9fa; transition: 0.3s; }
        .file-drop-area:hover { border-color: #1a73e8; }
        input[type="file"] { width: 100%; font-size: 14px; }
        .progress-container { width: 100%; background: #e0e0e0; border-radius: 8px; overflow: hidden; margin: 20px 0; display: none; }
        .progress-bar { width: 0%; height: 12px; background: #1a73e8; transition: width 0.2s ease; }
        .status-text { font-size: 14px; color: #5f6368; margin-bottom: 15px; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #1557b0; }
        button:disabled { background: #bdc1c6; cursor: not-allowed; }
        #resultBox { margin-top: 20px; display: none; text-align: left; background: #e8f0fe; padding: 15px; border-radius: 8px; word-break: break-all; }
        #resultBox p { margin: 0 0 8px 0; font-size: 14px; color: #174ea6; font-weight: bold; }
        #resultBox a { color: #1a73e8; text-decoration: none; display: block; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #d2e3fc; }
    </style>

    <script>
        window.uploadVideo = async function() {
            const fileInput = document.getElementById('videoFile');
            const uploadBtn = document.getElementById('uploadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');
            const resultBox = document.getElementById('resultBox');
            const shareLink = document.getElementById('shareLink');

            if (fileInput.files.length === 0) {
                alert('กรุณาเลือกไฟล์วิดีโอก่อนค่ะคุณชินอิจิ');
                return;
            }

            const file = fileInput.files[0];
            
            uploadBtn.disabled = true;
            progressContainer.style.display = 'block';
            resultBox.style.display = 'none';
            progressBar.style.width = '40%';
            statusText.innerText = 'กำลังอัปโหลดไฟล์...';

            try {
                const formData = new FormData();
                formData.append('file', file);

                // เปลี่ยนมาใช้ File.io API ที่รองรับการเชื่อมต่อจากเว็บทั่วไป
                const response = await fetch('https://file.io', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('การอัปโหลดล้มเหลวจากเซิร์ฟเวอร์ปลายทาง');
                }

                const data = await response.json();

                if (data.success) {
                    progressBar.style.width = '100%';
                    statusText.innerText = 'อัปโหลดสำเร็จเรียบร้อยค่ะ!';
                    uploadBtn.disabled = false;
                    
                    shareLink.href = data.link;
                    shareLink.innerText = data.link;
                    resultBox.style.display = 'block';
                } else {
                    throw new Error('ไม่สามารถรับลิงก์ดาวน์โหลดได้');
                }

            } catch (error) {
                alert('เกิดข้อผิดพลาดในการอัปโหลด: ' + error.message);
                uploadBtn.disabled = false;
                statusText.innerText = 'อัปโหลดไม่สำเร็จ';
                progressContainer.style.display = 'none';
            }
        };
    </script>
</head>
<body>

<div class="card">
    <h2>อัปโหลดคลิปวิดีโอ (Fast Mode)</h2>
    <div class="file-drop-area">
        <input type="file" id="videoFile" accept="video/*">
    </div>
    
    <button id="uploadBtn" onclick="uploadVideo()">อัปโหลดคลิปทันที</button>
    
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText"></div>

    <div id="resultBox">
        <p>🔗 ลิงก์สำหรับแชร์ให้ผู้อื่น:</p>
        <a id="shareLink" href="#" target="_blank"></a>
    </div>
</div>

</body>
</html>
